# Esegue check-devportal-pages/check_pagine.py e fallisce se almeno un controllo e' KO.

name: Controllo pagine developer.pagopa.it

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * 1-5"   # opzionale: ogni giorno feriale alle 07:00 UTC
  push:
    branches: feat/check-devportal-pages
    paths:
      - "check-devportal-pages/**"
      - ".github/workflows/check-devportal-pages.yml"

jobs:
  check:
    runs-on: ubuntu-latest   # Google Chrome e' gia' installato sul runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: check-devportal-pages   # i comandi "run" partono da qui
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: check-devportal-pages/requirements.txt

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui il controllo
        run: python check_pagine.py   # esce con codice 1 se c'e' almeno un KO

